[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saferun-local"
version = "0.1.0"
description = "A local repository auditor with constrained, Docker-only test execution."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "jinja2>=3.1,<4.0",
  "python-multipart>=0.0.9,<1.0",
  "argon2-cffi>=23.1,<26.0",
]

[project.scripts]
saferun = "saferun.cli:main"

[tool.setuptools.packages.find]
include = ["saferun*"]

[tool.setuptools.package-data]
saferun = ["schema.sql", "templates/*.html", "static/*"]
